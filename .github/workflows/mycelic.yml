name: mycelic

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", "demo/**", "deploy/mycelic/**", "scripts/**",
            "research/**", "requirements.txt", ".github/workflows/mycelic.yml"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NATS_VERSION: v2.10.22

jobs:
  rust:
    name: fmt, clippy, unit, golden, API, MCP, JetStream integration and process smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nats-server
        run: |
          curl -sSL -o nats.tgz "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          tar xzf nats.tgz && sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version
      - name: validate nats.conf
        run: NATS_STORE_DIR=/tmp/js NATS_USER=ci NATS_PASSWORD=ci-password-with-letters nats-server -t -c deploy/mycelic/nats/nats.conf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --bins --locked
      - run: cargo test --workspace --locked
      - name: production smoke test (process driver, 6 agents)
        run: ./target/debug/mycelic-smoke --driver process --report smoke-process.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-process-report
          path: smoke-process.json

  research:
    name: research/mycelic tests (Python until the research port)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest research.mycelic.test_mycelic

  compose:
    name: docker compose deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the host-side harness (smoke test, demos, agent process)
        run: cargo build --release --locked -p mycelic-harness -p mycelic-sdk --bins
      - name: compose config fails loudly without secrets
        run: |
          if docker compose -f deploy/mycelic/docker-compose.yml config >/dev/null 2>&1; then
            echo "compose must refuse to start without secrets"; exit 1; fi
      - name: build image and run the smoke test against the compose stack
        run: ./target/release/mycelic-smoke --driver compose --report smoke-compose.json
      - name: strategic synthesis demo against the compose stack
        run: ./target/release/mycelic-strategic-demo --driver compose --no-build --pace 0
      - name: image size
        if: always()
        run: docker image ls mycelic:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-compose-report
          path: smoke-compose.json

  kubernetes-manifests:
    name: render kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/mycelic/k8s > /dev/null && echo "manifests render"
