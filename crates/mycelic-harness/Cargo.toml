[package]
name = "mycelic-harness"
description = "Deployment drivers (local processes, docker compose), the production smoke test and the demos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mycelic-smoke"
path = "src/bin/mycelic-smoke.rs"

[[bin]]
name = "mycelic-demo"
path = "src/bin/mycelic-demo.rs"

[[bin]]
name = "mycelic-strategic-demo"
path = "src/bin/mycelic-strategic-demo.rs"

[[bin]]
name = "mycelic-live"
path = "src/bin/mycelic-live.rs"

[dependencies]
mycelic-sdk = { path = "../mycelic-sdk" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
regex.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
ureq.workspace = true

[dev-dependencies]
serde_json.workspace = true
